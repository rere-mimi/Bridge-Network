<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Bridge Network">
  <defs>
    <linearGradient id="bn-bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <!-- Mark plate -->
  <rect width="64" height="64" rx="14" fill="url(#bn-bg)"/>
  <!-- Spreadsheet sheet -->
  <rect x="10" y="28" width="44" height="26" rx="3" fill="#e0f2fe" opacity="0.95"/>
  <!-- Sheet header row -->
  <rect x="10" y="28" width="44" height="6" rx="3" fill="#7dd3fc"/>
  <rect x="10" y="31" width="44" height="3" fill="#7dd3fc"/>
  <!-- Grid lines (spreadsheet) -->
  <g stroke="#0369a1" stroke-opacity="0.35" stroke-width="1">
    <path d="M10 34.5h44M10 40.5h44M10 46.5h44"/>
    <path d="M21 28v26M32 28v26M43 28v26"/>
  </g>
  <!-- Arch bridge over the sheet -->
  <path
    d="M12 36 C20 12, 44 12, 52 36"
    stroke="#0f172a"
    stroke-width="3.2"
    stroke-linecap="round"
    fill="none"
    opacity="0.88"
  />
  <path
    d="M14 36 C21 16, 43 16, 50 36"
    stroke="#f8fafc"
    stroke-width="1.6"
    stroke-linecap="round"
    fill="none"
  />
  <!-- Pier / abutment posts reading as spreadsheet columns -->
  <path d="M18 36v12M32 28v20M46 36v12" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
  <path d="M18 36v12M32 28v20M46 36v12" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
  <!-- Deck line -->
  <path d="M12 36h40" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
</svg>
